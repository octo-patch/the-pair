<!DOCTYPE html>
<!-- the-pair launch 10s — concept: one take through a run (chain reaction).
BEAT SHEET — every beat is caused by the one before; the hand + task text survive every boundary.
 t            beat                                              moves                                   carries into the next beat
 0.00–0.90    hook: "two agents." / "one review." words land     wordRise ×2, hold                       the word "review." slides into the task line
 0.90–2.60    hub card pops in; hand types the task              popIn, typeOn, cursor                    the typed task text
 2.60–2.95    task text flies into the console as mission-spec   morphRect (card→mission)                the mission card
 2.95–5.10    mentor plan ticks off 3 lines                      tick ×3                                 the plan card (folds)
 5.10–5.60    hand presses Approve                               press, cursor                           the approval flash
 5.60–7.30    executor result rows stamp ✓                      tick ×4 (rows), progress                 the ✓ seal
 7.30–8.30    commit chip flies off to the branch pill           hop (chip), gather                       the branch pill
 8.30–9.20    pull back: hub card, now Finished                  camera pull-back, drift                  the wordmark dot
 9.20–10.00   THE PAIR wordmark + tagline, hold                  letterDrop, still hold                   (end card)
Rhythm: words .35s apart, holds .9s, no staccato — a launch calm, not a burst film. Stillness: hook hold + end hold.
Look: the product's own dark ink (harbor navy ground, mentor blue / executor purple / amber), Geist faces. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>the-pair · launch 10s</title>
<style>
:root{
  --bg:#0a0e14; --surface:#111820; --ink:#e6edf3; --muted:#8b949e; --faint:#5a6474;
  --mentor:#4db2e8; --executor:#b478e8; --amber:#d29922; --green:#3fb950; --line:#2a3444;
}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
body{font-family:'Geist Sans',-apple-system,'SF Pro Text','Segoe UI',sans-serif;color:var(--ink)}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--bg)}
.abs{position:absolute;left:0;top:0;will-change:transform,opacity}
/* hook words */
#hook{left:0;right:0;top:400px;text-align:center;font-size:96px;font-weight:600;letter-spacing:-.02em}
#hook span{display:inline-block;margin:0 .12em}
#hook .m{color:var(--mentor)} #hook .e{color:var(--executor)}
/* hub card */
#hub{width:760px;left:0;top:0;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 32px}
#hub .nm{font-size:34px;font-weight:600}
#hub .row{display:flex;align-items:center;gap:14px;margin-top:16px;font-size:22px;color:var(--muted)}
#hub .pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 16px;font-size:19px;color:var(--ink)}
#hub .task{margin-top:18px;min-height:44px;font-size:23px;color:var(--ink);white-space:pre-wrap}
#hub .caret{display:inline-block;width:3px;height:26px;background:var(--amber);vertical-align:-5px;margin-left:2px}
/* mission + plan + result cards */
#mission{width:900px;left:0;top:0;background:rgba(63,185,80,.08);border:1px solid rgba(63,185,80,.4);border-radius:16px;padding:24px 30px}
#mission h5,#plan h5,#result h5{margin:0 0 12px;font-size:19px;font-weight:600;letter-spacing:.14em;color:var(--muted)}
#mission .tx{font-family:'Geist Mono',monospace;font-size:23px;line-height:1.5}
#plan{width:940px;left:0;top:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 30px}
#plan .ln{display:flex;align-items:center;gap:14px;min-height:52px;font-size:22px;border-top:1px solid var(--line)}
#plan .ln .bx{width:24px;height:24px;border-radius:7px;border:1.5px solid #4a5568;position:relative;flex:none}
#plan .ln .bx:after{content:"";position:absolute;left:7px;top:3px;width:6px;height:12px;border-right:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(45deg);opacity:0}
#plan .ln.on .bx{background:var(--mentor);border-color:var(--mentor)}
#plan .ln.on .bx:after{opacity:1}
#plan .ln .t{font-family:'Geist Mono',monospace;font-size:21.5px}
#approve{margin-top:18px;display:inline-block;background:var(--green);color:#06110a;font-weight:600;font-size:22px;border-radius:12px;padding:12px 28px}
#result{width:940px;left:0;top:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 30px}
#result table{width:100%;border-collapse:collapse;font-size:21px}
#result td{border-top:1px solid var(--line);padding:9px 6px}
#result td.st{color:var(--green);font-family:'Geist Mono',monospace;font-size:19px}
#result .stamp{display:inline-block;margin-top:14px;border:2px solid var(--green);color:var(--green);font-weight:700;font-size:24px;letter-spacing:.1em;border-radius:10px;padding:8px 22px}
/* commit chip + branch pill */
#chip{left:0;top:0;background:var(--surface);border:1px solid var(--amber);color:var(--amber);border-radius:999px;padding:10px 24px;font-family:'Geist Mono',monospace;font-size:21px;white-space:nowrap}
#branch{left:760px;top:500px;border:1px solid var(--line);border-radius:999px;padding:12px 28px;font-family:'Geist Mono',monospace;font-size:22px;color:var(--muted)}
#branch b{color:var(--ink);font-weight:600}
/* wordmark */
#mark{font-size:150px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;left:0;right:0;top:400px;text-align:center}
#mark span{display:inline-block}
#mark .dot{color:var(--amber)}
#tag{text-align:center;font-size:34px;color:var(--muted);top:590px;left:0;right:0;position:absolute;white-space:nowrap}
#tag b{color:var(--ink)}
#cursor{position:absolute;width:34px;height:44px;left:0;top:0;will-change:transform,opacity}
#hud{position:absolute;left:12px;top:8px;font:14px monospace;color:#f66;display:none}
</style>
</head>
<body>
<div id="stage">
  <div id="hook" class="abs"><span>two</span> <span class="m">agents.</span> <span>one</span> <span class="e">review.</span></div>
  <div id="hub" class="abs">
    <div class="nm">contact-spam-filter</div>
    <div class="row"><span class="pill">Finished</span><span>3/8 · the-pair/contact-spam-filter</span></div>
    <div class="task"><span id="tasktxt"></span><span class="caret" id="taskcaret"></span></div>
  </div>
  <div id="mission" class="abs"><h5>MISSION SPECS</h5><div class="tx" id="missiontx"></div></div>
  <div id="plan" class="abs"><h5>MENTOR · PLAN</h5><div id="planlines"></div><span id="approve">Approve &amp; start</span></div>
  <div id="result" class="abs"><h5>EXECUTOR · RESULT</h5>
    <table id="restable"></table><span class="stamp" id="stamp">VERIFIED ✓</span>
  </div>
  <div id="chip" class="abs">the-pair: filter spam ✓</div>
  <div id="branch" class="abs">push → <b>the-pair/contact-spam-filter</b></div>
  <div id="mark" class="abs"></div>
  <div id="tag" class="abs">Mentor plans. Executor ships. <b>The Pair reviews.</b></div>
  <svg id="cursor" viewBox="0 0 34 44"><path d="M4 3 L30 22 L18 24 L26 40 L20 43 L12 27 L4 36 Z" fill="#e6edf3" stroke="#0a0e14" stroke-width="2.5" stroke-linejoin="round"/></svg>
  <div id="hud"></div>
</div>
<script src="motion.js"></script>
<script>
// ── timeline (10 s; shot lengths .35 s words … 1 s holds) ──
const FPS=30, DUR=10;
window.__meta={dur:DUR,fps:FPS,w:1920,h:1080,inFrame:{hub:[0.9,2.6],plan:[2.9,5.6],result:[5.6,7.3],mark:[9.2,10.0,'whole']}};
const HOOK=[0.05,0.40,0.75,1.10], HOOK_OUT=1.30;
const HUB_IN=2.00, TYPE0=2.25, TASK='Filter SEO + crypto spam from the contact form', CLICK_SEND=2.45, HUB_OUT=2.62;
const MISSION_IN=2.62, MISSION_OUT=3.15;
const PLAN_IN=3.05, TICK0=3.45, TICK_DT=0.42, APPROVE_T=5.25, PLAN_OUT=5.62;
const RESULT_IN=5.55, ROW0=5.95, ROW_DT=0.30, STAMP_T=7.15, RESULT_OUT=7.72;
const CHIP_T=7.22, CHIP_LAND=8.15, PULL_T=8.30, MARK_T=9.20;
const {clamp,lerp,sstep,ssstep,spring:spr,spline}=OM;
// ── DOM ──
const $=id=>document.getElementById(id);
const TASK_EL=$('tasktxt'), MISSION_TX=$('missiontx');
const PLAN_LINES=['Keyword lists (SEO + crypto) — lowercase sets','Case-insensitive match across all fields','Typed results: spam_detected + keywords'];
const planEls=PLAN_LINES.map(tx=>{const d=document.createElement('div');d.className='ln';d.innerHTML=`<div class="bx"></div><div class="t">${tx}</div>`;$('planlines').appendChild(d);return d;});
const ROWS=[['SEO keyword filtering','12 keywords covered'],['Crypto keyword filtering','18 keywords covered'],['Case-insensitive matching','toLowerCase() applied'],['Typed spam results','{ success: false }']];
const rowEls=ROWS.map(([a,b])=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${a}</td><td class="st"></td>`;tr.lastChild.dataset.full=b;$('restable').appendChild(tr);return tr;});
const MARKTXT='THE PAIR'; const markEl=$('mark');
const MARKL=[...MARKTXT].map(ch=>{const s=document.createElement('span');s.textContent=ch;markEl.appendChild(s);return s;});
// hand: one path — types, clicks send, presses approve, rests, lands on the mark
const SEND_PT={x:580+760-70,y:380+170}, APPROVE_PT={x:490+200,y:300+330};
const HAND=[
  {t:1.10,x:1500,y:950},{t:1.45,x:900,y:560},{t:2.45,x:SEND_PT.x,y:SEND_PT.y},{t:2.62,x:SEND_PT.x,y:SEND_PT.y},
  {t:3.00,x:1200,y:800},{t:5.00,x:APPROVE_PT.x+260,y:APPROVE_PT.y+40},{t:5.25,x:APPROVE_PT.x,y:APPROVE_PT.y},
  {t:5.55,x:APPROVE_PT.x,y:APPROVE_PT.y},{t:6.20,x:1300,y:760},{t:8.10,x:1200,y:700},{t:9.30,x:960,y:640},{t:10.0,x:960,y:640}
];
const hand=t=>spline(HAND,t);
const CLICKS=[CLICK_SEND,APPROVE_T];
// ── helpers ──
function place(el,x,y,s=1,op=1){el.style.opacity=op;el.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${s.toFixed(4)})`;}
// mission card morphs out of the hub card rect
const HUB_R={x:580,y:400,w:760,h:230}, MISSION_R={x:510,y:350,w:900,h:220};
// ── seek ──
function seek(t){
  // 1 · hook words
  const hk=$('hook'); const out1=sstep(HOOK_OUT,HOOK_OUT+0.25,t);
  hk.style.opacity=1-out1; hk.style.transform=`translateY(${(-out1*60).toFixed(1)}px)`;
  [...hk.children].forEach((s,i)=>{const w=OM.wordRise(t,HOOK[i]);s.style.opacity=w.op;s.style.transform=`translateY(${w.y.toFixed(1)}px) scale(${w.s.toFixed(4)})`;});
  // 2 · hub card + typing hand
  {const el=$('hub');const ei=OM.popIn(t,HUB_IN),eo=OM.liftOut(t,HUB_OUT);const vis=t>=HUB_IN-0.05&&t<HUB_OUT+0.3;
   place(el,580,400+ei.dy+eo.dy,ei.s*eo.s,vis?ei.op*eo.op:0);
   const ty=OM.typeOn(t,TYPE0,TASK,{cps:30});TASK_EL.textContent=ty.str;
   $('taskcaret').style.opacity=(t>=TYPE0&&t<HUB_OUT)?ty.caret:0;}
  // 3 · mission morphs out of the hub
  {const el=$('mission');const vis=t>=MISSION_IN&&t<MISSION_OUT+0.25;
   const m=OM.morphRect(t,MISSION_IN,MISSION_IN+0.45,HUB_R,MISSION_R);
   el.style.opacity=vis?m.op:0;el.style.transform=`translate(${m.x.toFixed(1)}px,${m.y.toFixed(1)}px) scale(${(m.w/MISSION_R.w).toFixed(4)},${(m.h/MISSION_R.h).toFixed(4)})`;el.style.transformOrigin='0 0';
   const ty=OM.typeOn(t,MISSION_IN+0.1,TASK,{cps:60});MISSION_TX.textContent=ty.str;}
  // 4 · plan ticks
  {const el=$('plan');const ei=OM.popIn(t,PLAN_IN),eo=OM.liftOut(t,PLAN_OUT);const vis=t>=PLAN_IN-0.05&&t<PLAN_OUT+0.3;
   place(el,490,330+ei.dy+eo.dy,ei.s*eo.s,vis?ei.op*eo.op:0);
   planEls.forEach((ln,i)=>{const tk=OM.tick(t,TICK0+i*TICK_DT);ln.classList.toggle('on',tk.on);ln.querySelector('.bx').style.transform=`scale(${tk.s})`;ln.style.opacity=sstep(PLAN_IN+0.05,PLAN_IN+0.2,t);});
   const p=OM.press(t,APPROVE_T);$('approve').style.transform=`scale(${p.s.toFixed(3)})`;}
  // 5 · result rows stamp
  {const el=$('result');const ei=OM.popIn(t,RESULT_IN),eo=OM.liftOut(t,RESULT_OUT);const vis=t>=RESULT_IN-0.05&&t<RESULT_OUT+0.3;
   place(el,490,300+ei.dy+eo.dy,ei.s*eo.s,vis?ei.op*eo.op:0);
   rowEls.forEach((tr,i)=>{const on=t>=ROW0+i*ROW_DT;tr.style.opacity=on?1:0.15;if(on&&!tr.lastChild.textContent)tr.lastChild.textContent=tr.lastChild.dataset.full;if(!on)tr.lastChild.textContent='';});
   const st=OM.tick(t,STAMP_T);$('stamp').style.opacity=st.on?1:0;$('stamp').style.transform=`scale(${st.s})`;}
  // 6 · commit chip hops to the branch pill
  {const chip=$('chip'),br=$('branch');
   const cvis=t>=CHIP_T&&t<CHIP_LAND+0.25,bvis=t>=CHIP_LAND-0.15&&t<PULL_T+0.2;
   if(cvis){const h=OM.hop(t,CHIP_T,CHIP_LAND,{x:520,y:556},{x:840,y:560},{height:210});
     chip.style.opacity=1;chip.style.transform=`translate(${h.x.toFixed(1)}px,${h.y.toFixed(1)}px)`;}
   else chip.style.opacity=0;
   br.style.opacity=bvis?ssstep(CHIP_LAND-0.15,CHIP_LAND+0.15,t):0;
   if(t>=CHIP_LAND&&t<PULL_T)br.style.borderColor='var(--green)';else br.style.borderColor='';}
  // 7 · pull back to hub (finished) then wordmark
  {const hb=$('hub');const back=t>=PULL_T&&t<MARK_T;
   if(back){const ei=OM.popIn(t,PULL_T);place(hb,580,400+ei.dy,ei.s,ei.op);
     hb.querySelector('.pill').textContent='Finished';TASK_EL.textContent=TASK;$('taskcaret').style.opacity=0;}
   else if(t<MARK_T&&t<HUB_OUT+0.3){/* earlier placement */}
   const mv=t>=MARK_T;markEl.style.opacity=mv?1:0;
   MARKL.forEach((s,i)=>{const d=OM.letterDrop(t,MARK_T,i*0.06);s.style.opacity=d.op;s.style.transform=`translateY(${d.y.toFixed(1)}px)`;});
   $('tag').style.opacity=t>=MARK_T+0.35?1:0;}
  // hand
  {const vis=t>=1.05&&t<9.35;const cu=OM.cursor(t,HAND,CLICKS);
   $('cursor').style.opacity=vis?1:0;$('cursor').style.transform=`translate(${(cu.x-4).toFixed(1)}px,${(cu.y-3).toFixed(1)}px) scale(${cu.s})`;}
  // camera: slow push through the work, whip to the mark, settle + drift hold
  $('hud').textContent='t='+t.toFixed(3);
  return Promise.resolve(true);
}
window.__seek=async t=>{await seek(t);return true;};
// camera applied at the stage level via CSS transform on #stage
// Camera: it HOLDS. Every beat keeps one exact framing for its whole duration,
// and the scale only changes inside the short hand-off windows where a card is
// already flying (mission morph, approve press, the pull back). A camera that
// interpolates continuously re-rasterizes every glyph on every frame, which
// reads as text shivering — so each segment below is a duplicated key pair:
// identical x/y/zoom means OM.camera returns that framing unchanged, and the
// scale change between segments is covered by the moving card.
const SEG=[
  {t:0.00,x:960,y:540,zoom:1.000},   // hook words — dead still, the film's first rest
  {t:2.05,x:960,y:540,zoom:1.000},   // hub types (still)
  {t:2.45,x:960,y:540,zoom:1.020},   // send press → mission morph is moving
  {t:2.85,x:960,y:528,zoom:1.020},   // plan lands, holds while it ticks
  {t:5.05,x:960,y:528,zoom:1.020},   // (hold — ticks 3.45–4.29, hand arrives 5.0)
  {t:5.55,x:960,y:520,zoom:1.060},   // approve press → result swap is moving
  {t:5.95,x:960,y:520,zoom:1.060},   // rows stamp (hold)
  {t:7.20,x:960,y:520,zoom:1.060},   // seal lands (hold)
  {t:7.55,x:960,y:520,zoom:1.030},   // chip hops toward the branch pill
  {t:8.30,x:960,y:536,zoom:1.010},   // pull back onto the finished card
  {t:8.70,x:960,y:540,zoom:1.000},   // settled
  {t:10.00,x:960,y:540,zoom:1.000},  // wordmark — still hold, no drift
];
const CAM=SEG.flatMap(k=>[{...k,curve:OM.ease.cubicInOut}]);
const _seek=window.__seek;
window.__seek=async t=>{
  const r=await _seek(t);
  const c=OM.camera(t,CAM);const M=OM.view(c);
  $('stage').style.transform=`matrix(${M[0].toFixed(5)},${M[1].toFixed(5)},${M[2].toFixed(5)},${M[3].toFixed(5)},${M[4].toFixed(1)},${M[5].toFixed(1)})`;
  return r;
};
window.__motion=(t0,t1)=>{
  const c0=OM.camera(t0,CAM),c1=OM.camera(t1,CAM),cm=OM.camera((t0+t1)/2,CAM);
  return OM.screenTravel(c0,c1,cm);
};
window.__meta.cuts=[];
// Hold check: within a hold segment the camera keys are identical, so the stage
// matrix must be byte-identical frame to frame. Any drift here means text will
// re-rasterize and shimmer. Segments marked hold: [start, end] pairs below.
window.__holds=[[0.10,1.95],[2.95,5.00],[6.00,7.15],[8.75,10.00]];
window.__cameraStable=(t)=>{
  const c=OM.camera(t,CAM);const M=OM.view(c);
  return [M[0].toFixed(5),M[1].toFixed(5),M[2].toFixed(5),M[3].toFixed(5),M[4].toFixed(1),M[5].toFixed(1)].join(',');
};
window.__ready=document.fonts.ready.then(()=>seek(0));
const q=new URLSearchParams(location.search);
if(q.has('t'))__ready.then(()=>seek(parseFloat(q.get('t'))));
if(q.has('hud'))$('hud').style.display='block';
if(q.has('play'))__ready.then(()=>{const t0=performance.now();(function loop(){seek(((performance.now()-t0)/1000)%DUR);requestAnimationFrame(loop);})();});
</script>
</body>
</html>
